include:
    - template: Code-Quality.gitlab-ci.yml

stages:
  - data
  - train
  - test
  # - evaluate

variables:
    EOS_STORAGE_DIR: /eos/user/s/stella/EventTaggerCI/files
    EOS_MODEL_DIR: /eos/user/s/stella/EventTaggerCI/output
    AUTO_DEVOPS_CERNBOX_USER: stella

.template:
  image: gitlab-registry.cern.ch/ml_l1/ops/docker-images/mamba_eventtagger:latest
  before_script:
    - export PYTHONPATH=/builds/stella/EventTagger:$PYTHONPATH
    - echo "$AUTO_DEVOPS_CERNBOX_PASS" | kinit "$AUTO_DEVOPS_CERNBOX_USER@CERN.CH" > /dev/null
    - env
  script:
    - python $FOLDER/$SCRIPT $ARGS
  tags: [cern-nextgen-gpu]
  # rules: # run automatically on default branch, tags, and on merge requests with 'ci::automatic-build' label; otherwise run manually
  #    - if: '($CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_MERGE_REQUEST_LABELS =~ /ci::automatic-build/)'
  #      when: on_success

data:
  extends:
    - .template
  stage: data
  tags: [cern-nextgen-gpu]
  variables:
    KUBERNETES_MEMORY_REQUEST: 32Gi
    KUBERNETES_CPU_REQUEST: 2
  # rules:
  #   - changes:  # Include the job and set to when:manual if any of the follow paths match a modified file.
  #       - tagger/data/**
  #     when: manual
  script:
  - source activate eventtagger
  - mkdir files
  - cd files
  - export EOS_MGM_URL=root://eoscms.cern.ch
  - cd ..
  - python tagger/data/make_data.py --signal ${PROCESS}
  - export EOS_MGM_URL=root://eosproject.cern.ch
  - eos mkdir -p ${EOS_STORAGE_DIR}/${PROCESS}
  - eos cp files/${PROCESS}/* ${EOS_STORAGE_DIR}/${PROCESS}
  parallel:
    matrix:
      - PROCESS: ["MinBias", "VBFHToBB", "VBFHToTauTau", "VBFHToCC", "GGFHHTo4B", "GGFHHTo2B2Tau"]

train:
  extends:
    - .template
  stage: train
  tags: [cern-nextgen-gpu]
  needs:
    - job : data
      optional: true
  script:
  - source activate eventtagger
  - mkdir -p files
  - |
      IFS=',' read -ra PROCS <<< "$Train_processes"

      for PROC in "${PROCS[@]}"; do
        echo "Fetching ${PROC}..."
        mkdir -p "files/${PROC}"
        eos cp "${EOS_STORAGE_DIR}/${PROC}/data.npz" files/${PROC}
      done

      # Sort processes so the order in Train_processes does not matter
      SORTED_PROCS=($(printf '%s\n' "${PROCS[@]}" | sort))

      PROCESS_SUFFIX=$(IFS='_'; echo "${SORTED_PROCS[*]}")

      EOS_MODEL_SUBDIR="${EOS_MODEL_DIR}/${Name}/${PROCESS_SUFFIX}"

  - python tagger/train/train.py --train --model-config "${Model}.yaml" --model-name "${Name}" --processes "${PROCS[@]}"
  - python tagger/train/train.py --evaluate --model-config "${Model}.yaml" --model-name "${Name}" --processes "${PROCS[@]}"

  # - cd "output/${Model}/${PROCESS_SUFFIX}"

  # - eos mkdir -p "${EOS_MODEL_SUBDIR}"
  # - eos cp -r * "${EOS_MODEL_SUBDIR}"
  # - echo "Saving model to: ${EOS_MODEL_SUBDIR}"

  # - export MODEL_LOCATION="${EOS_MODEL_SUBDIR}"
  artifacts:
    paths:
      - output
    exclude:
      - .npy
    expire_in: 1 day

